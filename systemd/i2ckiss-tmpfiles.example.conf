# Optional /dev compatibility alias for the tnc0 instance. Install an edited
# copy as /etc/tmpfiles.d/i2ckiss.conf and run: systemd-tmpfiles --create
#
# This stable public name points to the device published by the tnc0 service.
L /dev/i2ckiss-tnc0 - - - - /run/i2ckiss-tnc0/pty
